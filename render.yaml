services:
  - type: web
    name: japanese-vocab-copilot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_MODE
        value: github
      - key: FRONTEND_ORIGIN
        value: https://jerryleung16.github.io
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ALLOWED_GITHUB_LOGIN
        value: jerryleung16
      - key: SESSION_SECRET
        generateValue: true
      - key: COPILOT_GITHUB_TOKEN
        sync: false